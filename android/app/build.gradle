// 파일: android/app/build.gradle
// 목적:
// - app 모듈에서 RN 플러그인을 plugins DSL로 적용
// - compileSdk/targetSdk/minSdk 등을 rootProject.ext에서 가져와 고정
// - Hermes/JSC 분기 유지

plugins {
  id("com.android.application")
  id("org.jetbrains.kotlin.android")
  id("com.facebook.react")
  id("com.google.gms.google-services")
  id("com.google.firebase.crashlytics")
}

react {
  autolinkLibrariesWithApp()
}

def geolocationCodegenScript = rootProject.file("../scripts/ensure-geolocation-codegen.js")

tasks.register("ensureGeolocationCodegen", Exec) {
  workingDir rootProject.projectDir.parentFile
  commandLine("node", geolocationCodegenScript.absolutePath)
}

preBuild.dependsOn("ensureGeolocationCodegen")

def enableProguardInReleaseBuilds = false
def nuriReleaseSigning = [
  'NURI_UPLOAD_STORE_FILE', 'NURI_UPLOAD_STORE_PASSWORD',
  'NURI_UPLOAD_KEY_ALIAS', 'NURI_UPLOAD_KEY_PASSWORD'
].collectEntries { name -> [(name): System.getenv(name)] }

// Debug configuration remains usable; every Release task requires protected inputs.
gradle.taskGraph.whenReady { graph ->
  if (graph.allTasks.any { it.project == project && it.name.toLowerCase(Locale.ROOT).contains('release') }) {
    def missing = nuriReleaseSigning.findAll { name, value -> value == null || value.isEmpty() }.keySet()
    if (!missing.isEmpty()) {
      throw new GradleException("Missing protected Release signing inputs: " + missing.join(', '))
    }
  }
}
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { localProperties.load(it) }
}
def nuriGoogleMapsApiKey = (
  project.findProperty("NURI_GOOGLE_MAPS_API_KEY")
    ?: System.getenv("NURI_GOOGLE_MAPS_API_KEY")
    ?: localProperties.getProperty("NURI_GOOGLE_MAPS_API_KEY")
)?.toString()?.trim()

if (!nuriGoogleMapsApiKey) {
  throw new GradleException(
    "NURI_GOOGLE_MAPS_API_KEY must be supplied through a Gradle property, environment variable, or android/local.properties."
  )
}

android {
  namespace "com.nuri"
  sourceSets { androidTest.assets.srcDirs += ["$projectDir/schemas"] }
  // Local compilation uses debug tests. Canonical QA Release also produces a
  // same-signer instrumentation APK; Store intent has no QA/test packaging.
  testBuildType (project.findProperty("nuriSecurityQa") == "true" ? "release" : "debug")

  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdkVersion rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId "com.nuri.app"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    javaCompileOptions {
      annotationProcessorOptions {
        arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
      }
    }
    buildConfigField "boolean", "NURI_SECURITY_QA", (project.findProperty("nuriSecurityQa") == "true").toString()
    manifestPlaceholders["NURI_GOOGLE_MAPS_API_KEY"] = nuriGoogleMapsApiKey
  }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
    release {
      if (nuriReleaseSigning.values().every { it != null && !it.isEmpty() }) {
        storeFile file(nuriReleaseSigning.NURI_UPLOAD_STORE_FILE)
        storePassword nuriReleaseSigning.NURI_UPLOAD_STORE_PASSWORD
        keyAlias nuriReleaseSigning.NURI_UPLOAD_KEY_ALIAS
        keyPassword nuriReleaseSigning.NURI_UPLOAD_KEY_PASSWORD
      }
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      firebaseCrashlytics {
        mappingFileUploadEnabled false
        nativeSymbolUploadEnabled false
      }
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
      firebaseCrashlytics {
        mappingFileUploadEnabled true
        nativeSymbolUploadEnabled false
      }
    }
  }
}

if (project.findProperty("nuriSecurityQa") == "true") {
  tasks.matching { it.name == "assembleRelease" }.configureEach {
    finalizedBy("assembleReleaseAndroidTest")
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  // Same pinned BOM as the existing RN Firebase app/Crashlytics integration.
  implementation(platform("com.google.firebase:firebase-bom:34.8.0"))
  implementation("com.google.firebase:firebase-messaging")
  // Match react-native-blur's pinned capture engine for local foreground exclusion.
  implementation("com.github.qmdeve.qmblurview:core:v1.3.0")
  implementation("com.google.android.gms:play-services-location:21.3.0")
  implementation("androidx.room:room-runtime:2.8.4")
  // Java Room DAO uses javac processing: no KSP/kapt or toolchain upgrade.
  annotationProcessor("androidx.room:room-compiler:2.8.4")
  testImplementation("junit:junit:4.13.2")
  androidTestImplementation("androidx.test.ext:junit:1.3.0")
  androidTestImplementation("androidx.test:runner:1.7.0")

  if (project.hasProperty('hermesEnabled') && hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation(jscFlavor)
  }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
